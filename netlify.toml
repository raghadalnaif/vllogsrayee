[build]
  functions = "netlify/functions"
  publish = "."
  command = "cd netlify/functions && npm install"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security headers applied to every response so the site opens for visitors
# without browser/scanner security warnings. Kept intentionally compatible with
# the inline scripts and the Moyasar payment + OTP flow (no restrictive CSP).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
